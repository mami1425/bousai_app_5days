{% extends "base.html" %}

{% block content %}
<h2>避難所登録</h2>
<p>新しい避難所情報を登録します。</p>

<!-- 成功・エラーメッセージ表示 -->
{% if success %}
  <p>{{ message }}</p>
{% endif %}

{% if error %}
  <p>{{ message }}</p>
{% endif %}

<form method="POST">
  <p>
    <label for="name">避難所名（必須）</label><br>
    <input type="text" id="name" name="name">
  </p>
  <p>
    <label for="status">開設状況</label><br>
    <select id="status" name="status">
      <option value="未開設" selected>未開設</option>
      <option value="開設中">開設中</option>
    </select>
  </p>
  <p><button type="submit">登録</button></p>
</form>
{% endblock %}
